schema_version: 1

context:
  version: "1.0.2"

package:
  name: libghostty-vt
  version: ${{ version }}

source:
  - url: https://release.files.ghostty.org/libghostty-vt/${{ version }}/libghostty-vt-${{ version }}.tar.gz
    sha256: 1dcafa8a3357f3a6bbf4f2696e61de611400c5469518716793dfffd35f008b3e
    patches:
      - patches/build-glibc-version.patch
  - url: https://release.files.ghostty.org/libghostty-vt/${{ version }}/libghostty-vt-${{ version }}-deps.tar.gz
    sha256: c56156dbea82fdf71f13bf0d704cdf4393b6a04208d7f9691e0d7f60c7f9ca4d
    target_directory: vt-deps
build:
  number: 0
  script:
    interpreter: python
    file: build-lib.py
    env:
      # Recipe variants are not automatically exported to build scripts.
      C_STDLIB_VERSION: ${{ c_stdlib_version if linux else "" }}
requirements:
  # The stable C ABI is compatible within the same major version.
  run_exports:
    - ${{ pin_subpackage('libghostty-vt', upper_bound='x') }}
  build:
    - zig 0.17.0.*
    - python >=3.11
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
tests:
  - package_contents:
      strict: true
      include:
        - ghostty/vt.h
        - ghostty/vt/osc.h
        - ghostty/vt/**/*.h
      lib:
        - ghostty-vt
        - if: unix
          then: libghostty-vt.a
          else: ghostty-vt-static.lib
      files:
        - etc/conda/test-files/libghostty-vt/0/test-lib.c
        - etc/conda/test-files/libghostty-vt/0/test-lib.py
        - if: win
          then: Library/bin/ghostty-vt.pdb
        - if: unix
          then:
            - lib/pkgconfig/libghostty-vt.pc
            - lib/pkgconfig/libghostty-vt-static.pc
            - lib/cmake/ghostty-vt/ghostty-vt-config.cmake
            - lib/cmake/ghostty-vt/ghostty-vt-config-version.cmake
          else:
            - Library/lib/pkgconfig/libghostty-vt.pc
            - Library/lib/pkgconfig/libghostty-vt-static.pc
            - Library/lib/cmake/ghostty-vt/ghostty-vt-config.cmake
            - Library/lib/cmake/ghostty-vt/ghostty-vt-config-version.cmake
  - script: python test-lib.py
    requirements:
      run:
        - python >=3.11
        - ${{ compiler('c') }}
        - pkgconf
    files:
      recipe:
        - test-lib.py
        - test-lib.c

about:
  homepage: https://ghostty.org
  summary: Ghostty VT parsing library with a C API
  description: Standalone terminal sequence parsing library, without the Ghostty GUI.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/ghostty-org/ghostty
  documentation: https://ghostty.org/docs

extra:
  recipe-maintainers:
    - davidbrochart
